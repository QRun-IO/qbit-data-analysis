- key: process:data_analysis_table_config.bulkInsert;slot:help
  summary: "Import new records from a file."
  content: |
    Use **{{label:data_analysis_table_config.bulkInsert}}** to add records to {{label:data_analysis_table_config}} from a file. Match your file columns to the available fields and review the input before continuing. Check the result for validation errors and records you need to correct.
- key: process:data_analysis_table_config.bulkEdit;slot:help
  summary: "Apply changes to multiple selected records."
  content: |
    Use **{{label:data_analysis_table_config.bulkEdit}}** to change fields on your selected records in {{label:data_analysis_table_config}}. Review your selection and the values you want to change before continuing. Check the result for records that could not be updated.
- key: process:data_analysis_table_config.bulkEditWithFile;slot:help
  summary: "Update existing records using values from a file."
  content: |
    Use **{{label:data_analysis_table_config.bulkEditWithFile}}** to update records in {{label:data_analysis_table_config}}. Match your file columns to fields and identify the existing records to update. Review the input before continuing and check the result for errors.
- key: process:data_analysis_table_config.bulkDelete;slot:help
  summary: "Delete multiple selected records."
  content: |
    Use **{{label:data_analysis_table_config.bulkDelete}}** to remove selected records from {{label:data_analysis_table_config}}. Review your selection carefully before confirming deletion. Check the result for records that could not be deleted.
