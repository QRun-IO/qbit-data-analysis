- key: process:data_analysis_table_config_create_rows;slot:help
  summary: "Create editable settings rows for analyzable tables that do not already have one."
  content: |
    Use **Create rows for analyzable tables** in Analysis Settings to copy the effective settings into new rows.
    Review the tables before continuing. Existing settings rows are left unchanged.
    You need permission to insert settings. Your analysis behavior stays the same until you edit a setting.
